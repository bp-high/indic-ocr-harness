name: Release

# See PUBLISHING.md.
# - Release by pushing a tag vX.Y.Z, or by running this workflow on main with "release" ticked (it creates the tag).
#   The version comes from _version.py and needs a dated CHANGELOG section. The run: CI, version checks, a
#   reproducible build, an install test, then a GitHub release with the wheel, the sdist, SHA256SUMS and the
#   changelog section.
# - PyPI is opt-in: set the repository variable PUBLISH_TO_PYPI=true after the one-time trusted-publisher setup. A
#   release then also publishes to TestPyPI, installs it back, and publishes to PyPI (after the `pypi` environment
#   gate) before the GitHub release.
# - A manual run without "release" tests the pipeline: CI and a X.Y.Z.dev<run> build, plus the TestPyPI steps when
#   PyPI is on. It never publishes a release.
# Publishing uses PyPI trusted publishing (OIDC): no token is stored anywhere.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of the version in _version.py (creates tag vX.Y.Z on main)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve and check the version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$RELEASE_INPUT" = true ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases are made from main"; exit 1; }
            tag="v$(python tools/release.py version)"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then echo "::error::$tag already exists"; exit 1; fi
            python tools/release.py ci-version --ref "refs/tags/$tag" --run-number "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            python tools/release.py ci-version --ref "$GITHUB_REF" --run-number "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            python tools/release.py ci-version --ref "$GITHUB_REF" --run-number "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: A release commit must be on main
        if: steps.version.outputs.release == 'true'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - run: pip install build twine
      - name: Build (reproducible; file times from the commit)
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
      - run: twine check --strict dist/*
      - name: Install-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/indic-ocr-harness --version | grep -F "${{ steps.version.outputs.version }}"
          /tmp/smoke/bin/indic-ocr-harness show-config > /dev/null
      - name: Build provenance attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/indic-ocr-harness/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the published wheel and check it is the one built
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/pub
          /tmp/pub/bin/pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # only the package itself comes from TestPyPI; its dependencies come from PyPI (no dependency confusion)
          for i in 1 2 3 4 5 6 7 8; do
            /tmp/pub/bin/pip download -q --no-deps --only-binary :all: --index-url https://test.pypi.org/simple/ \
              -d /tmp/wheel "indic-ocr-harness==$VERSION" && break
            echo "not on TestPyPI yet, retrying in 30 s"; sleep 30
          done
          cmp /tmp/wheel/*.whl dist/*.whl
          /tmp/pub/bin/pip install -q /tmp/wheel/*.whl
          /tmp/pub/bin/indic-ocr-harness --version | grep -F "$VERSION"

  pypi:
    if: vars.PUBLISH_TO_PYPI == 'true' && needs.build.outputs.release == 'true'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/indic-ocr-harness/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    # after PyPI when that is on; on its own when it is off (pypi skipped)
    if: >-
      always() && needs.build.result == 'success' && needs.build.outputs.release == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.pypi.result)
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          python3 tools/release.py notes "$VERSION" > notes.md
          wheel=$(cd dist && ls *.whl)
          cat >> notes.md <<EOF

          ### Install

          \`\`\`bash
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$wheel
          \`\`\`
          EOF
          (cd dist && sha256sum * > SHA256SUMS)
          # a pushed tag must exist; a manual release creates the tag on the commit that was built
          if [ "$GITHUB_EVENT_NAME" = push ]; then where=--verify-tag; else where="--target=$GITHUB_SHA"; fi
          gh release create "$TAG" dist/* "$where" --title "indic-ocr-harness $VERSION" --notes-file notes.md
