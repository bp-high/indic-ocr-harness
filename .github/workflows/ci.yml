name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # torch is a dependency: install the CPU wheels first so pip does not pull the much larger CUDA build
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Build and check the distributions
        run: |
          python -m build
          twine check --strict dist/*
          python - <<'PY'
          import glob, tarfile, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          bad = [n for n in wheel + sdist if n.endswith((".safetensors", ".jpg", ".png")) or "/idp_" in n or "reads.json" in n]
          assert not bad, bad
          assert any(n.endswith("indic_ocr_harness/py.typed") for n in wheel)
          print(len(wheel), "files in the wheel,", len(sdist), "in the sdist")
          PY
